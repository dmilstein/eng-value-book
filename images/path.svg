<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Planned vs. Reality
  </text>

  <!-- LEFT SIDE: Linear planned path -->
  <g transform="translate(50, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      The Plan
    </text>

    <!-- Straight line path -->
    <line x1="50" y1="50" x2="250" y2="50" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>

    <!-- Waypoints -->
    <circle cx="50" cy="50" r="6" fill="#2563eb"/>
    <circle cx="100" cy="50" r="4" fill="#2563eb"/>
    <circle cx="150" cy="50" r="4" fill="#2563eb"/>
    <circle cx="200" cy="50" r="4" fill="#2563eb"/>
    <circle cx="250" cy="50" r="6" fill="#2563eb"/>

    <!-- Labels -->
    <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Goal</text>
  </g>

  <!-- RIGHT SIDE: Hexagonal grid with wandering path -->
  <g transform="translate(450, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Reality
    </text>

    <!-- Hexagonal grid (light background) -->
    <defs>
      <pattern id="hexGrid" x="0" y="0" width="30" height="26" patternUnits="userSpaceOnUse">
        <polygon points="15,2 25,8 25,18 15,24 5,18 5,8" fill="none" stroke="#e5e7eb" stroke-width="1"/>
      </pattern>
    </defs>
    <rect x="0" y="40" width="300" height="200" fill="url(#hexGrid)"/>

    <!-- Actual wandering path -->
    <path d="M 50,50 L 70,80 L 100,70 L 130,100 L 160,90 L 180,120 L 210,110 L 240,140 L 270,130"
          fill="none" stroke="#dc2626" stroke-width="3"/>

    <!-- Decision points (where path changes direction) -->
    <circle cx="50" cy="50" r="6" fill="#dc2626"/>
    <circle cx="70" cy="80" r="3" fill="#dc2626"/>
    <circle cx="100" cy="70" r="3" fill="#dc2626"/>
    <circle cx="130" cy="100" r="3" fill="#dc2626"/>
    <circle cx="160" cy="90" r="3" fill="#dc2626"/>
    <circle cx="180" cy="120" r="3" fill="#dc2626"/>
    <circle cx="210" cy="110" r="3" fill="#dc2626"/>
    <circle cx="240" cy="140" r="3" fill="#dc2626"/>
    <circle cx="270" cy="130" r="6" fill="#dc2626"/>

    <!-- Show the "intended" end point as a ghost -->
    <circle cx="250" cy="50" r="6" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" opacity="0.7">Original Goal</text>

    <!-- Labels -->
    <text x="50" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="270" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Actual End</text>
  </g>

  <!-- Bottom explanation -->
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" opacity="0.8">
    We must make choices as we go, adapting to what we learn along the way
  </text>
</svg>
