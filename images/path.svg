<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Planned vs. Reality
  </text>

  <!-- LEFT SIDE: Linear planned path -->
  <g transform="translate(50, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      The Plan
    </text>

    <!-- Straight line path -->
    <line x1="50" y1="50" x2="250" y2="50" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>

    <!-- Waypoints -->
    <circle cx="50" cy="50" r="6" fill="#2563eb"/>
    <circle cx="100" cy="50" r="4" fill="#2563eb"/>
    <circle cx="150" cy="50" r="4" fill="#2563eb"/>
    <circle cx="200" cy="50" r="4" fill="#2563eb"/>
    <circle cx="250" cy="50" r="6" fill="#2563eb"/>

    <!-- Labels -->
    <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Goal</text>
  </g>

  <!-- RIGHT SIDE: Hexagonal tiling with path following edges -->
  <g transform="translate(450, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Reality
    </text>

    <!-- Hexagonal tiling - individual hexagons -->
    <!-- Row 1 -->
    <polygon points="45,50 55,44 65,50 65,62 55,68 45,62" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="75,50 85,44 95,50 95,62 85,68 75,62" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="105,50 115,44 125,50 125,62 115,68 105,62" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="135,50 145,44 155,50 155,62 145,68 135,62" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="165,50 175,44 185,50 185,62 175,68 165,62" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="195,50 205,44 215,50 215,62 205,68 195,62" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="225,50 235,44 245,50 245,62 235,68 225,62" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="255,50 265,44 275,50 275,62 265,68 255,62" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Row 2 (offset) -->
    <polygon points="60,74 70,68 80,74 80,86 70,92 60,86" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="90,74 100,68 110,74 110,86 100,92 90,86" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="120,74 130,68 140,74 140,86 130,92 120,86" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="150,74 160,68 170,74 170,86 160,92 150,86" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="180,74 190,68 200,74 200,86 190,92 180,86" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="210,74 220,68 230,74 230,86 220,92 210,86" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="240,74 250,68 260,74 260,86 250,92 240,86" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Row 3 -->
    <polygon points="45,98 55,92 65,98 65,110 55,116 45,110" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="75,98 85,92 95,98 95,110 85,116 75,110" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="105,98 115,92 125,98 125,110 115,116 105,110" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="135,98 145,92 155,98 155,110 145,116 135,110" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="165,98 175,92 185,98 185,110 175,116 165,110" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="195,98 205,92 215,98 215,110 205,116 195,110" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="225,98 235,92 245,98 245,110 235,116 225,110" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="255,98 265,92 275,98 275,110 265,116 255,110" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Row 4 (offset) -->
    <polygon points="60,122 70,116 80,122 80,134 70,140 60,134" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="90,122 100,116 110,122 110,134 100,140 90,134" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="120,122 130,116 140,122 140,134 130,140 120,134" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="150,122 160,116 170,122 170,134 160,140 150,134" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="180,122 190,116 200,122 200,134 190,140 180,134" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="210,122 220,116 230,122 230,134 220,140 210,134" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <polygon points="240,122 250,116 260,122 260,134 250,140 240,134" fill="none" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Path following hexagon edges -->
    <path d="M 55,56 L 85,56 L 100,74 L 130,74 L 145,92 L 175,92 L 190,110 L 220,110 L 235,128"
          fill="none" stroke="#dc2626" stroke-width="3"/>

    <!-- Decision points at hexagon vertices -->
    <circle cx="55" cy="56" r="6" fill="#dc2626"/>
    <circle cx="85" cy="56" r="3" fill="#dc2626"/>
    <circle cx="100" cy="74" r="3" fill="#dc2626"/>
    <circle cx="130" cy="74" r="3" fill="#dc2626"/>
    <circle cx="145" cy="92" r="3" fill="#dc2626"/>
    <circle cx="175" cy="92" r="3" fill="#dc2626"/>
    <circle cx="190" cy="110" r="3" fill="#dc2626"/>
    <circle cx="220" cy="110" r="3" fill="#dc2626"/>
    <circle cx="235" cy="128" r="6" fill="#dc2626"/>

    <!-- Show the "intended" end point as a ghost -->
    <circle cx="235" cy="56" r="6" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="235" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" opacity="0.7">Original Goal</text>

    <!-- Labels -->
    <text x="55" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="235" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Actual End</text>
  </g>

  <!-- Bottom explanation -->
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" opacity="0.8">
    We must make choices as we go, adapting to what we learn along the way
  </text>
</svg>
