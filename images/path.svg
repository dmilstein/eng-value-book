<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Planned vs. Reality
  </text>

  <!-- LEFT SIDE: Linear planned path -->
  <g transform="translate(50, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      The Plan
    </text>

    <!-- Straight line path -->
    <line x1="50" y1="50" x2="250" y2="50" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>

    <!-- Waypoints -->
    <circle cx="50" cy="50" r="6" fill="#2563eb"/>
    <circle cx="100" cy="50" r="4" fill="#2563eb"/>
    <circle cx="150" cy="50" r="4" fill="#2563eb"/>
    <circle cx="200" cy="50" r="4" fill="#2563eb"/>
    <circle cx="250" cy="50" r="6" fill="#2563eb"/>

    <!-- Labels -->
    <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Goal</text>
  </g>

  <!-- RIGHT SIDE: Hexagonal tiling with path following edges -->
  <g transform="translate(450, 110)">

    <!-- Title positioned above hexagonal grid -->
    <text x="150" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Reality
    </text>

    <!-- Hexagonal tiling - individual hexagons (pointy-top orientation) -->
    <!-- Row -3 (top empty row) -->
    <polygon points="60,-13 69,-8 69,2 60,7 51,2 51,-8" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="82,-13 91,-8 91,2 82,7 73,2 73,-8" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="104,-13 113,-8 113,2 104,7 95,2 95,-8" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="126,-13 135,-8 135,2 126,7 117,2 117,-8" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="148,-13 157,-8 157,2 148,7 139,2 139,-8" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="170,-13 179,-8 179,2 170,7 161,2 161,-8" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="192,-13 201,-8 201,2 192,7 183,2 183,-8" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="214,-13 223,-8 223,2 214,7 205,2 205,-8" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row -2 (offset empty row) -->
    <polygon points="71,4 80,9 80,19 71,24 62,19 62,9" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="93,4 102,9 102,19 93,24 84,19 84,9" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,4 124,9 124,19 115,24 106,19 106,9" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="137,4 146,9 146,19 137,24 128,19 128,9" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="159,4 168,9 168,19 159,24 150,19 150,9" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="181,4 190,9 190,19 181,24 172,19 172,9" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,4 212,9 212,19 203,24 194,19 194,9" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row -1 (empty row) -->
    <polygon points="60,21 69,26 69,36 60,41 51,36 51,26" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="82,21 91,26 91,36 82,41 73,36 73,26" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="104,21 113,26 113,36 104,41 95,36 95,26" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="126,21 135,26 135,36 126,41 117,36 117,26" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="148,21 157,26 157,36 148,41 139,36 139,26" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="170,21 179,26 179,36 170,41 161,36 161,26" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="192,21 201,26 201,36 192,41 183,36 183,26" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="214,21 223,26 223,36 214,41 205,36 205,26" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 0 (offset empty row) -->
    <polygon points="71,38 80,43 80,53 71,58 62,53 62,43" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="93,38 102,43 102,53 93,58 84,53 84,43" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,38 124,43 124,53 115,58 106,53 106,43" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="137,38 146,43 146,53 137,58 128,53 128,43" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="159,38 168,43 168,53 159,58 150,53 150,43" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="181,38 190,43 190,53 181,58 172,53 172,43" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,38 212,43 212,53 203,58 194,53 194,43" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 1 -->
    <polygon points="60,55 69,60 69,70 60,75 51,70 51,60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="82,55 91,60 91,70 82,75 73,70 73,60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="104,55 113,60 113,70 104,75 95,70 95,60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="126,55 135,60 135,70 126,75 117,70 117,60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="148,55 157,60 157,70 148,75 139,70 139,60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="170,55 179,60 179,70 170,75 161,70 161,60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="192,55 201,60 201,70 192,75 183,70 183,60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="214,55 223,60 223,70 214,75 205,70 205,60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 2 (offset) -->
    <polygon points="71,72 80,77 80,87 71,92 62,87 62,77" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="93,72 102,77 102,87 93,92 84,87 84,77" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,72 124,77 124,87 115,92 106,87 106,77" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="137,72 146,77 146,87 137,92 128,87 128,77" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="159,72 168,77 168,87 159,92 150,87 150,77" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="181,72 190,77 190,87 181,92 172,87 172,77" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,72 212,77 212,87 203,92 194,87 194,77" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 3 -->
    <polygon points="60,89 69,94 69,104 60,109 51,104 51,94" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="82,89 91,94 91,104 82,109 73,104 73,94" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="104,89 113,94 113,104 104,109 95,104 95,94" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="126,89 135,94 135,104 126,109 117,104 117,94" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="148,89 157,94 157,104 148,109 139,104 139,94" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="170,89 179,94 179,104 170,109 161,104 161,94" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="192,89 201,94 201,104 192,109 183,104 183,94" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="214,89 223,94 223,104 214,109 205,104 205,94" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 4 (offset) -->
    <polygon points="71,106 80,111 80,121 71,126 62,121 62,111" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="93,106 102,111 102,121 93,126 84,121 84,111" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,106 124,111 124,121 115,126 106,121 106,111" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="137,106 146,111 146,121 137,126 128,121 128,111" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="159,106 168,111 168,121 159,126 150,121 150,111" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="181,106 190,111 190,121 181,126 172,121 172,111" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,106 212,111 212,121 203,126 194,121 194,111" fill="none" stroke="#9ca3af" stroke-width="1"/>

    <!-- Path following hexagon edges precisely at intersection points -->
    <path d="M 69,60 L 82,55 L 91,60 L 93,72 L 102,77 L 115,72 L 124,77 L 126,89 L 135,94 L 148,89 L 157,94 L 159,106 L 168,111 L 181,106 L 190,111"
          fill="none" stroke="#dc2626" stroke-width="3"/>

    <!-- Decision points at hexagon intersection vertices -->
    <circle cx="69" cy="60" r="6" fill="#dc2626"/>
    <circle cx="82" cy="55" r="2" fill="#dc2626"/>
    <circle cx="91" cy="60" r="2" fill="#dc2626"/>
    <circle cx="93" cy="72" r="2" fill="#dc2626"/>
    <circle cx="102" cy="77" r="2" fill="#dc2626"/>
    <circle cx="115" cy="72" r="2" fill="#dc2626"/>
    <circle cx="124" cy="77" r="2" fill="#dc2626"/>
    <circle cx="126" cy="89" r="2" fill="#dc2626"/>
    <circle cx="135" cy="94" r="2" fill="#dc2626"/>
    <circle cx="148" cy="89" r="2" fill="#dc2626"/>
    <circle cx="157" cy="94" r="2" fill="#dc2626"/>
    <circle cx="159" cy="106" r="2" fill="#dc2626"/>
    <circle cx="168" cy="111" r="2" fill="#dc2626"/>
    <circle cx="181" cy="106" r="2" fill="#dc2626"/>
    <circle cx="190" cy="111" r="6" fill="#dc2626"/>

    <!-- Show the "intended" end point as a ghost -->
    <circle cx="201" cy="60" r="6" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="201" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" opacity="0.7">Original Goal</text>

    <!-- Labels -->
    <text x="69" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="190" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Actual End</text>
  </g>

  <!-- Bottom explanation -->
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" opacity="0.8">
    We must make choices as we go, adapting to what we learn along the way
  </text>
</svg>
