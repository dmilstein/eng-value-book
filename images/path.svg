<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Planned vs. Reality
  </text>

  <!-- LEFT SIDE: Linear planned path -->
  <g transform="translate(50, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      The Plan
    </text>

    <!-- Straight line path -->
    <line x1="50" y1="50" x2="250" y2="50" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>

    <!-- Waypoints -->
    <circle cx="50" cy="50" r="6" fill="#2563eb"/>
    <circle cx="100" cy="50" r="4" fill="#2563eb"/>
    <circle cx="150" cy="50" r="4" fill="#2563eb"/>
    <circle cx="200" cy="50" r="4" fill="#2563eb"/>
    <circle cx="250" cy="50" r="6" fill="#2563eb"/>

    <!-- Labels -->
    <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Goal</text>
  </g>

  <!-- RIGHT SIDE: Hexagonal tiling with path following edges -->
  <g transform="translate(450, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Reality
    </text>

    <!-- Hexagonal tiling - individual hexagons (pointy-top orientation) -->
    <!-- Row 1 -->
    <polygon points="55,44 65,50 55,56 45,50 45,38 55,32" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="85,44 95,50 85,56 75,50 75,38 85,32" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,44 125,50 115,56 105,50 105,38 115,32" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="145,44 155,50 145,56 135,50 135,38 145,32" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="175,44 185,50 175,56 165,50 165,38 175,32" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="205,44 215,50 205,56 195,50 195,38 205,32" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="235,44 245,50 235,56 225,50 225,38 235,32" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="265,44 275,50 265,56 255,50 255,38 265,32" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 2 (offset) -->
    <polygon points="70,62 80,68 70,74 60,68 60,56 70,50" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="100,62 110,68 100,74 90,68 90,56 100,50" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="130,62 140,68 130,74 120,68 120,56 130,50" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="160,62 170,68 160,74 150,68 150,56 160,50" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="190,62 200,68 190,74 180,68 180,56 190,50" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="220,62 230,68 220,74 210,68 210,56 220,50" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="250,62 260,68 250,74 240,68 240,56 250,50" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 3 -->
    <polygon points="55,80 65,86 55,92 45,86 45,74 55,68" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="85,80 95,86 85,92 75,86 75,74 85,68" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,80 125,86 115,92 105,86 105,74 115,68" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="145,80 155,86 145,92 135,86 135,74 145,68" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="175,80 185,86 175,92 165,86 165,74 175,68" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="205,80 215,86 205,92 195,86 195,74 205,68" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="235,80 245,86 235,92 225,86 225,74 235,68" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="265,80 275,86 265,92 255,86 255,74 265,68" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 4 (offset) -->
    <polygon points="70,98 80,104 70,110 60,104 60,92 70,86" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="100,98 110,104 100,110 90,104 90,92 100,86" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="130,98 140,104 130,110 120,104 120,92 130,86" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="160,98 170,104 160,110 150,104 150,92 160,86" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="190,98 200,104 190,110 180,104 180,92 190,86" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="220,98 230,104 220,110 210,104 210,92 220,86" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="250,98 260,104 250,110 240,104 240,92 250,86" fill="none" stroke="#9ca3af" stroke-width="1"/>

    <!-- Path following hexagon edges -->
    <path d="M 55,44 L 85,44 L 100,62 L 130,62 L 145,80 L 175,80 L 190,98 L 220,98 L 235,80"
          fill="none" stroke="#dc2626" stroke-width="3"/>

    <!-- Decision points at hexagon vertices -->
    <circle cx="55" cy="44" r="6" fill="#dc2626"/>
    <circle cx="85" cy="44" r="3" fill="#dc2626"/>
    <circle cx="100" cy="62" r="3" fill="#dc2626"/>
    <circle cx="130" cy="62" r="3" fill="#dc2626"/>
    <circle cx="145" cy="80" r="3" fill="#dc2626"/>
    <circle cx="175" cy="80" r="3" fill="#dc2626"/>
    <circle cx="190" cy="98" r="3" fill="#dc2626"/>
    <circle cx="220" cy="98" r="3" fill="#dc2626"/>
    <circle cx="235" cy="80" r="6" fill="#dc2626"/>

    <!-- Show the "intended" end point as a ghost -->
    <circle cx="235" cy="44" r="6" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="235" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" opacity="0.7">Original Goal</text>

    <!-- Labels -->
    <text x="55" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="235" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Actual End</text>
  </g>

  <!-- Bottom explanation -->
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" opacity="0.8">
    We must make choices as we go, adapting to what we learn along the way
  </text>
</svg>
