<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Planned vs. Reality
  </text>

  <!-- LEFT SIDE: Linear planned path -->
  <g transform="translate(50, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      The Plan
    </text>

    <!-- Straight line path -->
    <line x1="50" y1="50" x2="250" y2="50" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>

    <!-- Waypoints -->
    <circle cx="50" cy="50" r="6" fill="#2563eb"/>
    <circle cx="100" cy="50" r="4" fill="#2563eb"/>
    <circle cx="150" cy="50" r="4" fill="#2563eb"/>
    <circle cx="200" cy="50" r="4" fill="#2563eb"/>
    <circle cx="250" cy="50" r="6" fill="#2563eb"/>

    <!-- Labels -->
    <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Goal</text>
  </g>

  <!-- RIGHT SIDE: Hexagonal tiling with path following edges -->
  <g transform="translate(450, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Reality
    </text>

    <!-- Hexagonal tiling - individual hexagons (pointy-top orientation) -->
    <!-- Row 1 -->
    <polygon points="60,35 69,40 69,50 60,55 51,50 51,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="82,35 91,40 91,50 82,55 73,50 73,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="104,35 113,40 113,50 104,55 95,50 95,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="126,35 135,40 135,50 126,55 117,50 117,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="148,35 157,40 157,50 148,55 139,50 139,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="170,35 179,40 179,50 170,55 161,50 161,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="192,35 201,40 201,50 192,55 183,50 183,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="214,35 223,40 223,50 214,55 205,50 205,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 2 (offset) -->
    <polygon points="71,52 80,57 80,67 71,72 62,67 62,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="93,52 102,57 102,67 93,72 84,67 84,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,52 124,57 124,67 115,72 106,67 106,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="137,52 146,57 146,67 137,72 128,67 128,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="159,52 168,57 168,67 159,72 150,67 150,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="181,52 190,57 190,67 181,72 172,67 172,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,52 212,57 212,67 203,72 194,67 194,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 3 -->
    <polygon points="60,69 69,74 69,84 60,89 51,84 51,74" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="82,69 91,74 91,84 82,89 73,84 73,74" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="104,69 113,74 113,84 104,89 95,84 95,74" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="126,69 135,74 135,84 126,89 117,84 117,74" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="148,69 157,74 157,84 148,89 139,84 139,74" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="170,69 179,74 179,84 170,89 161,84 161,74" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="192,69 201,74 201,84 192,89 183,84 183,74" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="214,69 223,74 223,84 214,89 205,84 205,74" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 4 (offset) -->
    <polygon points="71,86 80,91 80,101 71,106 62,101 62,91" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="93,86 102,91 102,101 93,106 84,101 84,91" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,86 124,91 124,101 115,106 106,101 106,91" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="137,86 146,91 146,101 137,106 128,101 128,91" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="159,86 168,91 168,101 159,106 150,101 150,91" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="181,86 190,91 190,101 181,106 172,101 172,91" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,86 212,91 212,101 203,106 194,101 194,91" fill="none" stroke="#9ca3af" stroke-width="1"/>

    <!-- Path following hexagon edges -->
    <path d="M 60,35 L 69,40 L 73,50 L 82,55 L 91,50 L 95,40 L 104,35 L 113,40 L 115,52 L 124,57 L 126,69 L 135,74 L 148,69 L 157,74 L 159,86 L 168,91 L 181,86 L 190,91 L 192,69"
          fill="none" stroke="#dc2626" stroke-width="3"/>

    <!-- Decision points at hexagon vertices -->
    <circle cx="60" cy="35" r="6" fill="#dc2626"/>
    <circle cx="69" cy="40" r="2" fill="#dc2626"/>
    <circle cx="73" cy="50" r="2" fill="#dc2626"/>
    <circle cx="82" cy="55" r="2" fill="#dc2626"/>
    <circle cx="91" cy="50" r="2" fill="#dc2626"/>
    <circle cx="95" cy="40" r="2" fill="#dc2626"/>
    <circle cx="104" cy="35" r="2" fill="#dc2626"/>
    <circle cx="113" cy="40" r="2" fill="#dc2626"/>
    <circle cx="115" cy="52" r="2" fill="#dc2626"/>
    <circle cx="124" cy="57" r="2" fill="#dc2626"/>
    <circle cx="126" cy="69" r="2" fill="#dc2626"/>
    <circle cx="135" cy="74" r="2" fill="#dc2626"/>
    <circle cx="148" cy="69" r="2" fill="#dc2626"/>
    <circle cx="157" cy="74" r="2" fill="#dc2626"/>
    <circle cx="159" cy="86" r="2" fill="#dc2626"/>
    <circle cx="168" cy="91" r="2" fill="#dc2626"/>
    <circle cx="181" cy="86" r="2" fill="#dc2626"/>
    <circle cx="190" cy="91" r="2" fill="#dc2626"/>
    <circle cx="192" cy="69" r="6" fill="#dc2626"/>

    <!-- Show the "intended" end point as a ghost -->
    <circle cx="192" cy="35" r="6" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="192" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" opacity="0.7">Original Goal</text>

    <!-- Labels -->
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="192" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Actual End</text>
  </g>

  <!-- Bottom explanation -->
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" opacity="0.8">
    We must make choices as we go, adapting to what we learn along the way
  </text>
</svg>
