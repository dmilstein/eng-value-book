<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Planned vs. Reality
  </text>

  <!-- LEFT SIDE: Linear planned path -->
  <g transform="translate(50, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      The Plan
    </text>

    <!-- Straight line path -->
    <line x1="50" y1="50" x2="250" y2="50" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>

    <!-- Waypoints -->
    <circle cx="50" cy="50" r="6" fill="#2563eb"/>
    <circle cx="100" cy="50" r="4" fill="#2563eb"/>
    <circle cx="150" cy="50" r="4" fill="#2563eb"/>
    <circle cx="200" cy="50" r="4" fill="#2563eb"/>
    <circle cx="250" cy="50" r="6" fill="#2563eb"/>

    <!-- Labels -->
    <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Goal</text>
  </g>

  <!-- RIGHT SIDE: Hexagonal tiling with path following edges -->
  <g transform="translate(450, 110)">

    <!-- Title positioned above hexagonal grid -->
    <text x="150" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Reality
    </text>

    <!-- Hexagonal tiling - individual hexagons (pointy-top orientation) -->
    <!-- Row -3 (top empty row) -->
    <polygon points="60,-33 69,-28 69,-18 60,-13 51,-18 51,-28" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="82,-33 91,-28 91,-18 82,-13 73,-18 73,-28" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="104,-33 113,-28 113,-18 104,-13 95,-18 95,-28" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="126,-33 135,-28 135,-18 126,-13 117,-18 117,-28" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="148,-33 157,-28 157,-18 148,-13 139,-18 139,-28" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="170,-33 179,-28 179,-18 170,-13 161,-18 161,-28" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="192,-33 201,-28 201,-18 192,-13 183,-18 183,-28" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="214,-33 223,-28 223,-18 214,-13 205,-18 205,-28" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row -2 (offset empty row) -->
    <polygon points="71,-16 80,-11 80,-1 71,4 62,-1 62,-11" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="93,-16 102,-11 102,-1 93,4 84,-1 84,-11" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,-16 124,-11 124,-1 115,4 106,-1 106,-11" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="137,-16 146,-11 146,-1 137,4 128,-1 128,-11" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="159,-16 168,-11 168,-1 159,4 150,-1 150,-11" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="181,-16 190,-11 190,-1 181,4 172,-1 172,-11" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,-16 212,-11 212,-1 203,4 194,-1 194,-11" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row -1 (empty row) -->
    <polygon points="60,1 69,6 69,16 60,21 51,16 51,6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="82,1 91,6 91,16 82,21 73,16 73,6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="104,1 113,6 113,16 104,21 95,16 95,6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="126,1 135,6 135,16 126,21 117,16 117,6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="148,1 157,6 157,16 148,21 139,16 139,6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="170,1 179,6 179,16 170,21 161,16 161,6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="192,1 201,6 201,16 192,21 183,16 183,6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="214,1 223,6 223,16 214,21 205,16 205,6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 0 (offset empty row) -->
    <polygon points="71,18 80,23 80,33 71,38 62,33 62,23" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="93,18 102,23 102,33 93,38 84,33 84,23" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,18 124,23 124,33 115,38 106,33 106,23" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="137,18 146,23 146,33 137,38 128,33 128,23" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="159,18 168,23 168,33 159,38 150,33 150,23" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="181,18 190,23 190,33 181,38 172,33 172,23" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,18 212,23 212,33 203,38 194,33 194,23" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 1 -->
    <polygon points="60,35 69,40 69,50 60,55 51,50 51,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="82,35 91,40 91,50 82,55 73,50 73,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="104,35 113,40 113,50 104,55 95,50 95,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="126,35 135,40 135,50 126,55 117,50 117,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="148,35 157,40 157,50 148,55 139,50 139,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="170,35 179,40 179,50 170,55 161,50 161,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="192,35 201,40 201,50 192,55 183,50 183,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="214,35 223,40 223,50 214,55 205,50 205,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 2 (offset) -->
    <polygon points="71,52 80,57 80,67 71,72 62,67 62,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="93,52 102,57 102,67 93,72 84,67 84,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="115,52 124,57 124,67 115,72 106,67 106,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="137,52 146,57 146,67 137,72 128,67 128,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="159,52 168,57 168,67 159,72 150,67 150,57" fill="none" stroke="#9ca3af" stroke-width="1"/>
