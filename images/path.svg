<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Planned vs. Reality
  </text>

  <!-- LEFT SIDE: Linear planned path -->
  <g transform="translate(50, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      The Plan
    </text>

    <!-- Straight line path -->
    <line x1="50" y1="50" x2="250" y2="50" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>

    <!-- Waypoints -->
    <circle cx="50" cy="50" r="6" fill="#2563eb"/>
    <circle cx="100" cy="50" r="4" fill="#2563eb"/>
    <circle cx="150" cy="50" r="4" fill="#2563eb"/>
    <circle cx="200" cy="50" r="4" fill="#2563eb"/>
    <circle cx="250" cy="50" r="6" fill="#2563eb"/>

    <!-- Labels -->
    <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Goal</text>
  </g>

  <!-- RIGHT SIDE: Hexagonal tiling with path following edges -->
  <g transform="translate(450, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Reality
    </text>

    <!-- Hexagonal tiling - individual hexagons (pointy-top orientation) -->
    <!-- Row 1 -->
    <polygon points="60,35 69,40 69,50 60,55 51,50 51,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="86,35 95,40 95,50 86,55 77,50 77,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="112,35 121,40 121,50 112,55 103,50 103,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="138,35 147,40 147,50 138,55 129,50 129,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="164,35 173,40 173,50 164,55 155,50 155,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="190,35 199,40 199,50 190,55 181,50 181,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="216,35 225,40 225,50 216,55 207,50 207,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="242,35 251,40 251,50 242,55 233,50 233,40" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 2 (offset) -->
    <polygon points="73,57 82,62 82,72 73,77 64,72 64,62" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="99,57 108,62 108,72 99,77 90,72 90,62" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="125,57 134,62 134,72 125,77 116,72 116,62" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="151,57 160,62 160,72 151,77 142,72 142,62" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="177,57 186,62 186,72 177,77 168,72 168,62" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,57 212,62 212,72 203,77 194,72 194,62" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="229,57 238,62 238,72 229,77 220,72 220,62" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 3 -->
    <polygon points="60,79 69,84 69,94 60,99 51,94 51,84" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="86,79 95,84 95,94 86,99 77,94 77,84" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="112,79 121,84 121,94 112,99 103,94 103,84" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="138,79 147,84 147,94 138,99 129,94 129,84" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="164,79 173,84 173,94 164,99 155,94 155,84" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="190,79 199,84 199,94 190,99 181,94 181,84" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="216,79 225,84 225,94 216,99 207,94 207,84" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="242,79 251,84 251,94 242,99 233,94 233,84" fill="none" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Row 4 (offset) -->
    <polygon points="73,101 82,106 82,116 73,121 64,116 64,106" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="99,101 108,106 108,116 99,121 90,116 90,106" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="125,101 134,106 134,116 125,121 116,116 116,106" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="151,101 160,106 160,116 151,121 142,116 142,106" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="177,101 186,106 186,116 177,121 168,116 168,106" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="203,101 212,106 212,116 203,121 194,116 194,106" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <polygon points="229,101 238,106 238,116 229,121 220,116 220,106" fill="none" stroke="#9ca3af" stroke-width="1"/>

    <!-- Path following hexagon edges -->
    <path d="M 60,35 L 86,35 L 99,57 L 125,57 L 138,79 L 164,79 L 177,101 L 203,101 L 216,79"
          fill="none" stroke="#dc2626" stroke-width="3"/>

    <!-- Decision points at hexagon vertices -->
    <circle cx="60" cy="35" r="6" fill="#dc2626"/>
    <circle cx="86" cy="35" r="3" fill="#dc2626"/>
    <circle cx="99" cy="57" r="3" fill="#dc2626"/>
    <circle cx="125" cy="57" r="3" fill="#dc2626"/>
    <circle cx="138" cy="79" r="3" fill="#dc2626"/>
    <circle cx="164" cy="79" r="3" fill="#dc2626"/>
    <circle cx="177" cy="101" r="3" fill="#dc2626"/>
    <circle cx="203" cy="101" r="3" fill="#dc2626"/>
    <circle cx="216" cy="79" r="6" fill="#dc2626"/>

    <!-- Show the "intended" end point as a ghost -->
    <circle cx="216" cy="35" r="6" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="216" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" opacity="0.7">Original Goal</text>

    <!-- Labels -->
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Start</text>
    <text x="216" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Actual End</text>
  </g>

  <!-- Bottom explanation -->
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" opacity="0.8">
    We must make choices as we go, adapting to what we learn along the way
  </text>
</svg>
